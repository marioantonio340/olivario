<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Fundo arredondado elegante de App Icon -->
  <rect width="160" height="160" rx="36" fill="#0F172A" />
  <g transform="translate(20, 20) scale(1.0)">
    
<g id="olivario-symbol">
  <defs>
    <linearGradient id="oliveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Anel externo estilizado (Letra O / Nó tecnológico) -->
  <path d="M 60 12 C 33.49 12 12 33.49 12 60 C 12 86.51 33.49 108 60 108 C 76.8 108 91.6 99.3 100.1 86 C 96.5 87.5 92.5 88.2 88.3 88.2 C 67.2 88.2 50.1 71.1 50.1 50 C 50.1 36.6 57 24.8 67.6 18 C 65.1 17.3 62.6 12 60 12 Z"
        fill="url(#techGrad)" />

  <!-- Folha de Oliveira Ascendente / Vértice de Software (Dinâmica e Vitalidade) -->
  <path d="M 60 12 C 72 26 84 46 84 62 C 84 75.25 73.25 86 60 86 C 46.75 86 36 75.25 36 62 C 36 44 50 24 60 12 Z"
        fill="url(#oliveGrad)" />

  <!-- Nervura central / Conexão de código digital -->
  <path d="M 60 22 C 60 40 60 55 60 76"
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 8" />

  <!-- Ponto focal / Núcleo de dados (Tech Node) -->
  <circle cx="60" cy="76" r="4.5" fill="#FFFFFF" />
  <circle cx="86" cy="38" r="5" fill="#22C55E" />
</g>

  </g>
</svg>